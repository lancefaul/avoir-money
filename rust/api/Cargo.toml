[package]
name = "avoir-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
avoir-core = { path = "../core" }
avoir-db = { path = "../db" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Names the FIELD a deserialization error happened on. Without it every
# validation failure reports `field: "body"`, and the frontend renders that name
# against the input the user has to fix — so a typed-wrong `amount` pointed at
# the form as a whole rather than at the amount box.
serde_path_to_error = "0.1"
chrono = { workspace = true }
rust_decimal = { workspace = true }
anyhow = { workspace = true }
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true }
