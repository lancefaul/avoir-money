[workspace]
resolver = "2"
members = ["spike-money", "spike-sqlx", "spike-seaorm"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
rust_decimal = { version = "1.42", features = ["db-postgres", "serde-with-str"] }
rust_decimal_macros = "1.40"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1.11"
anyhow = "1"
chrono = "0.4"
